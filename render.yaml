services:
  - type: web
    name: car-rental-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_backend.py
    envVars:
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: car-rental-db
          property: connectionString

databases:
  - name: car-rental-db
    plan: free
